name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: history
          POSTGRES_PASSWORD: history_dev
          POSTGRES_DB: hardware_history_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U history -d hardware_history_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: python -m pip install -r backend/requirements.lock
      - run: python -m pip check
      - name: SQLite tests
        working-directory: backend
        run: python -m pytest -q
      - name: PostgreSQL tests
        working-directory: backend
        env:
          HHE_TEST_DATABASE_URL: postgresql+psycopg://history:history_dev@localhost:5432/hardware_history_test
        run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm test
      - working-directory: frontend
        run: npm run build
      - run: docker compose config --quiet
      - run: docker compose build

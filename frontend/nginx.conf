server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 12m;

    location /api/admin/imports {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 45s;
    }
    location /media/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
